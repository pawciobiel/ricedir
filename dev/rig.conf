# A headless sway, for testing anything visual.
#
#   WLR_BACKENDS=headless WLR_HEADLESS_OUTPUTS=1 sway --config dev/rig.conf &
#   SOCK=$(ls -t /run/user/$UID/sway-ipc.$UID.*.sock | head -1)
#   WAYLAND_DISPLAY=wayland-2 SWAYSOCK=$SOCK ./target/release/ricedir /tmp/ricedir-test/many
#
# Never test rendering against the live session. Presentation is gated on
# `wl_surface.frame` callbacks, and a compositor whose output is asleep or
# locked stops sending them -- a surface made in that window never paints,
# which looks exactly like a rendering bug. hypridle runs on this machine.
# See CLAUDE.md, "Never conclude anything visual from a live desktop session".

output HEADLESS-1 mode 1280x800 bg #11111b solid_color

# Nothing is bound, so a take needs nobody holding a keyboard.
default_border none
gaps inner 0
focus_follows_mouse no

# A cursor that a screenshot can see, and big enough to read once scaled down.
seat * xcursor_theme default 32
seat * hide_cursor 0
