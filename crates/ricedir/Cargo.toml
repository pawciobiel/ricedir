[package]
name = "ricedir"
description = "A Wayland file manager built with iced, that an agent can be watched using"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["wayland", "file-manager", "iced", "hyprland", "mcp"]
categories = ["gui"]
readme = "../../README.md"

[dependencies]
# `image` and `svg` are what let a file type's icon be a picture from an icon
# theme rather than a font glyph. They pull in decoders and resvg, which is
# most of ricedir's compile time -- worth it for a program whose whole job is
# to show a directory and look good doing it.
#
# `advanced` exposes the widget traits. It is not optional here: the file list
# is a widget of ours, because iced's own `table` builds an `Element` per cell
# and a directory can hold 100k of them.
iced = { version = "0.14", features = ["tokio", "image", "svg", "advanced"] }
jiff = "0.2"
# Directory watching. `macos_fsevent` and the serde features are for platforms
# and uses ricedir has none of, so only the inotify backend is compiled.
notify = { version = "8", default-features = false }
# `regex-lite` rather than `regex`: the scan chain matches filenames, which is
# a hundred bytes against a pattern somebody typed into their own config. It
# has no dependencies and a fraction of the compile time, and none of what it
# gives up -- Unicode character classes, the SIMD search -- is wanted here.
regex-lite = "0.1"
ricedir-protocol.workspace = true
serde.workspace = true
toml = "1"
# `sync` is the bridge from the listing and job threads to the Elm loop: file
# work is blocking I/O and belongs on plain threads, and a tokio channel is
# what carries results back into a subscription.
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }

[dev-dependencies]
# A runtime, for the tests only. iced owns the real one, so ricedir itself
# never builds one -- but a test that starts a handler needs a reactor for the
# child to be registered with, and `tokio::process` panics without one.
tokio = { version = "1", features = ["macros", "rt"] }

# Pedantic and nursery, with the exceptions argued in the workspace file.
[lints]
workspace = true
