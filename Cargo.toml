# One repository, three crates.
#
# The split is not tidiness. `ricedir-mcp` must not be able to call anything
# that touches a file: the rule in CLAUDE.md is that file tools refuse when no
# window runs, and a rule a compiler enforces is stronger than a rule a person
# remembers. So the MCP program depends on `ricedir-protocol` and nothing else,
# and asks the running window to do the work.
#
# `ricedir-protocol` holds the messages and nothing more. It deliberately does
# not hold the MIME code, the scan chain or the config: the MCP program never
# needs to answer those questions, only to ask them.
[workspace]
resolver = "3"
members = ["crates/protocol", "crates/ricedir", "crates/mcp"]

# `cargo run` and `cargo build` with no `-p` mean the file manager, which is
# what anyone typing them wants.
default-members = ["crates/ricedir"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pawciobiel/ricedir"
# Installed with `cargo install --git`, not from crates.io: publishing there
# means signing in through GitHub and granting that login access it does not
# need. This stops an accidental `cargo publish` rather than a deliberate one.
publish = false

[workspace.dependencies]
ricedir-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
